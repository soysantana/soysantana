<svg width="900" height="290" viewBox="0 0 900 290" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Analytics</title>
  <desc id="desc">GitHub contribution analytics for soysantana</desc>
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .title { fill: #24292f; font: 700 24px Segoe UI, Arial, sans-serif; }
    .subtitle { fill: #57606a; font: 500 13px Segoe UI, Arial, sans-serif; }
    .label { fill: #57606a; font: 600 12px Segoe UI, Arial, sans-serif; letter-spacing: 0; }
    .value { fill: #0969da; font: 700 25px Segoe UI, Arial, sans-serif; letter-spacing: 0; }
    .text { fill: #24292f; font: 600 13px Segoe UI, Arial, sans-serif; }
    .muted { fill: #57606a; font: 500 12px Segoe UI, Arial, sans-serif; }
    .line { stroke: #0969da; }
    .area { fill: #0969da; opacity: .15; }
    .bar-bg { fill: #d8dee4; }
    .bar { fill: #2da44e; }
    .axis { stroke: #d8dee4; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .title { fill: #f0f6fc; }
      .subtitle, .label, .muted { fill: #8b949e; }
      .value { fill: #58a6ff; }
      .text { fill: #f0f6fc; }
      .line { stroke: #58a6ff; }
      .area { fill: #58a6ff; opacity: .18; }
      .bar-bg { fill: #30363d; }
      .bar { fill: #3fb950; }
      .axis { stroke: #30363d; }
    }
  </style>
  <rect class="bg" width="900" height="290" rx="16" />
  <text class="title" x="30" y="42">GitHub Analytics</text>
  <text class="subtitle" x="30" y="62">Public contribution data from the last year</text>
  <rect class="card" x="30" y="76" width="250" height="72" rx="10" />
  <text class="label" x="48" y="106">Commits</text>
  <text class="value" x="48" y="141">143</text>
<rect class="card" x="310" y="76" width="250" height="72" rx="10" />
  <text class="label" x="328" y="106">Pull Requests</text>
  <text class="value" x="328" y="141">19</text>
<rect class="card" x="590" y="76" width="250" height="72" rx="10" />
  <text class="label" x="608" y="106">Issues</text>
  <text class="value" x="608" y="141">5</text>
<rect class="card" x="30" y="168" width="250" height="72" rx="10" />
  <text class="label" x="48" y="198">Code Reviews</text>
  <text class="value" x="48" y="233">1</text>
<rect class="card" x="310" y="168" width="250" height="72" rx="10" />
  <text class="label" x="328" y="198">Stars</text>
  <text class="value" x="328" y="233">4</text>
<rect class="card" x="590" y="168" width="250" height="72" rx="10" />
  <text class="label" x="608" y="198">Contributions</text>
  <text class="value" x="608" y="233">677</text>
</svg>
