<svg width="900" height="215" viewBox="0 0 900 215" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Trophies</title>
  <desc id="desc">Compact GitHub achievement cards</desc>
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .title { fill: #24292f; font: 700 24px Segoe UI, Arial, sans-serif; }
    .subtitle { fill: #57606a; font: 500 13px Segoe UI, Arial, sans-serif; }
    .label { fill: #57606a; font: 600 12px Segoe UI, Arial, sans-serif; letter-spacing: 0; }
    .value { fill: #0969da; font: 700 25px Segoe UI, Arial, sans-serif; letter-spacing: 0; }
    .text { fill: #24292f; font: 600 13px Segoe UI, Arial, sans-serif; }
    .muted { fill: #57606a; font: 500 12px Segoe UI, Arial, sans-serif; }
    .line { stroke: #0969da; }
    .area { fill: #0969da; opacity: .15; }
    .bar-bg { fill: #d8dee4; }
    .bar { fill: #2da44e; }
    .axis { stroke: #d8dee4; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .title { fill: #f0f6fc; }
      .subtitle, .label, .muted { fill: #8b949e; }
      .value { fill: #58a6ff; }
      .text { fill: #f0f6fc; }
      .line { stroke: #58a6ff; }
      .area { fill: #58a6ff; opacity: .18; }
      .bar-bg { fill: #30363d; }
      .bar { fill: #3fb950; }
      .axis { stroke: #30363d; }
    }
  </style>
  <rect class="bg" width="900" height="215" rx="16" />
  <text class="title" x="30" y="42">GitHub Trophies</text>
  <text class="subtitle" x="30" y="62">Useful categories only, generated without third-party trophy services</text>
  <rect class="card" x="30" y="76" width="105" height="110" rx="10" />
  <circle cx="82" cy="103" r="15" fill="#f2cc60" opacity=".9" />
  <rect x="75" y="116" width="14" height="18" rx="3" fill="#bf8700" opacity=".9" />
  <text class="label" x="82" y="143" text-anchor="middle">Commits</text>
  <text class="value" x="82" y="172" text-anchor="middle">146</text>
<rect class="card" x="151" y="76" width="105" height="110" rx="10" />
  <circle cx="203" cy="103" r="15" fill="#f2cc60" opacity=".9" />
  <rect x="196" y="116" width="14" height="18" rx="3" fill="#bf8700" opacity=".9" />
  <text class="label" x="203" y="143" text-anchor="middle">PRs</text>
  <text class="value" x="203" y="172" text-anchor="middle">24</text>
<rect class="card" x="272" y="76" width="105" height="110" rx="10" />
  <circle cx="324" cy="103" r="15" fill="#f2cc60" opacity=".9" />
  <rect x="317" y="116" width="14" height="18" rx="3" fill="#bf8700" opacity=".9" />
  <text class="label" x="324" y="143" text-anchor="middle">Issues</text>
  <text class="value" x="324" y="172" text-anchor="middle">11</text>
<rect class="card" x="393" y="76" width="105" height="110" rx="10" />
  <circle cx="445" cy="103" r="15" fill="#f2cc60" opacity=".9" />
  <rect x="438" y="116" width="14" height="18" rx="3" fill="#bf8700" opacity=".9" />
  <text class="label" x="445" y="143" text-anchor="middle">Reviews</text>
  <text class="value" x="445" y="172" text-anchor="middle">1</text>
<rect class="card" x="514" y="76" width="105" height="110" rx="10" />
  <circle cx="566" cy="103" r="15" fill="#f2cc60" opacity=".9" />
  <rect x="559" y="116" width="14" height="18" rx="3" fill="#bf8700" opacity=".9" />
  <text class="label" x="566" y="143" text-anchor="middle">Stars</text>
  <text class="value" x="566" y="172" text-anchor="middle">4</text>
<rect class="card" x="635" y="76" width="105" height="110" rx="10" />
  <circle cx="687" cy="103" r="15" fill="#f2cc60" opacity=".9" />
  <rect x="680" y="116" width="14" height="18" rx="3" fill="#bf8700" opacity=".9" />
  <text class="label" x="687" y="143" text-anchor="middle">Repos</text>
  <text class="value" x="687" y="172" text-anchor="middle">7</text>
<rect class="card" x="756" y="76" width="105" height="110" rx="10" />
  <circle cx="808" cy="103" r="15" fill="#f2cc60" opacity=".9" />
  <rect x="801" y="116" width="14" height="18" rx="3" fill="#bf8700" opacity=".9" />
  <text class="label" x="808" y="143" text-anchor="middle">Best Streak</text>
  <text class="value" x="808" y="172" text-anchor="middle">11</text>
</svg>
